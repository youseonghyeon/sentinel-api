replicaCount: 1

image:
  repository: "epfzja/sentinel-api"
  pullPolicy: IfNotPresent
  tag: "ea79e448b415499be6239d162b3e9bc542363f62"

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  automount: true
  annotations: {}
  name: ""

podAnnotations: {}
podLabels: {}

podSecurityContext: {}

securityContext: {}

service:
  type: ClusterIP
  port: 8080
  actuatorPort: 8081

secretName: sentinel-secret

livenessProbe:
  httpGet:
    path: /actuator/health/liveness
    port: actuator
  initialDelaySeconds: 60
  periodSeconds: 10

readinessProbe:
  httpGet:
    path: /actuator/health/readiness
    port: actuator
  initialDelaySeconds: 30
  periodSeconds: 10

resources: {}

persistence:
  enabled: true
  storageClass: local-path
  size: 10Gi
  mountPath: /data
  storageRoot: /data/apps

nodeSelector: {}
tolerations: []
affinity: {}
