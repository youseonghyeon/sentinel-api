replicaCount: 1

image:
  repository: "epfzja/sentinel-api"
  pullPolicy: IfNotPresent
  tag: "7073d35c2ef0f49f6781a7a2f019013e0a148a7b"

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  automount: true
  annotations: {}
  name: ""

podAnnotations: {}
podLabels: {}

podSecurityContext: {}

securityContext: {}

service:
  type: ClusterIP
  port: 8080
  actuatorPort: 8081

secretName: sentinel-secret

livenessProbe:
  httpGet:
    path: /actuator/health/liveness
    port: actuator
  initialDelaySeconds: 60
  periodSeconds: 10

readinessProbe:
  httpGet:
    path: /actuator/health/readiness
    port: actuator
  initialDelaySeconds: 30
  periodSeconds: 10

resources: {}

nodeSelector: {}
tolerations: []
affinity: {}
