<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#f6f8fa">
    <title>Sentinel Admin · 로그인</title>
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body class="login-page">
<main class="login-shell">
    <div class="login-brand"><span class="brand-mark" aria-hidden="true">S</span><span>Sentinel</span></div>
    <section class="login-form-panel">
        <h1>관리자 로그인</h1>
        <p>등록된 매니저 계정으로 로그인하세요.</p>
        <form th:action="@{/login}" method="post">
            <p class="login-error" role="alert" th:if="${param.error}">아이디 또는 비밀번호가 올바르지 않습니다. 입력값을 다시 확인해 주세요.</p>
            <label for="username">아이디</label>
            <input type="text" id="username" name="username" autocomplete="username" spellcheck="false" required>
            <label for="password">비밀번호</label>
            <input type="password" id="password" name="password" autocomplete="current-password" required>
            <button type="submit">로그인</button>
        </form>
    </section>
</main>
</body>
</html>
