<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ko">
<head>
    <meta charset="UTF-8">
    <title>Sentinel - 로그인</title>
    <link rel="stylesheet" th:href="@{/css/app.css}">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { background: #f5f5f5; display: flex; justify-content: center; align-items: center; height: 100vh; }
        .card { background: #fff; padding: 40px; border-radius: 8px; box-shadow: 0 2px 12px rgba(0,0,0,0.1); width: 360px; }
        h1 { font-size: 22px; margin-bottom: 28px; text-align: center; color: #222; }
        label { display: block; font-size: 13px; color: #555; margin-bottom: 6px; }
        input { width: 100%; padding: 10px 12px; border: 1px solid #ddd; border-radius: 4px; font-size: 14px; margin-bottom: 16px; }
        button { width: 100%; padding: 11px; background: #2563eb; color: #fff; border: none; border-radius: 4px; font-size: 15px; cursor: pointer; }
        button:hover { background: #1d4ed8; }
        .error { color: #dc2626; font-size: 13px; margin-bottom: 14px; text-align: center; }
    </style>
</head>
<body>
<div class="card">
    <h1>Sentinel</h1>
    <form th:action="@{/login}" method="post">
        <p class="error" th:if="${param.error}">아이디 또는 비밀번호가 올바르지 않습니다.</p>
        <label for="username">아이디</label>
        <input type="text" id="username" name="username" required autofocus>
        <label for="password">비밀번호</label>
        <input type="password" id="password" name="password" required>
        <button type="submit">로그인</button>
    </form>
</div>
</body>
</html>
