<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#0f172a">
    <title>Sentinel Admin · 로그인</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&amp;family=Roboto+Mono:wght@400;500;600&amp;display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body class="login-page">
<main class="login-shell">
    <section class="login-brand-panel" aria-label="Sentinel 소개">
        <div class="login-brand"><span class="brand-mark" aria-hidden="true">S</span> Sentinel</div>
        <div>
            <h1>운영 상태를 한눈에, 접근 제어는 안전하게.</h1>
            <p>애플리케이션 배포와 사용자 접근을 관리하는 Sentinel 관리자 콘솔입니다.</p>
        </div>
    </section>
    <section class="login-form-panel">
        <h2>관리자 로그인</h2>
        <p>등록된 매니저 계정으로 로그인하세요.</p>
        <form th:action="@{/login}" method="post">
            <p class="login-error" role="alert" th:if="${param.error}">아이디 또는 비밀번호가 올바르지 않습니다. 입력값을 다시 확인해 주세요.</p>
            <label for="username">아이디</label>
            <input type="text" id="username" name="username" autocomplete="username" spellcheck="false" required autofocus>
            <label for="password">비밀번호</label>
            <input type="password" id="password" name="password" autocomplete="current-password" required>
            <button type="submit">로그인</button>
        </form>
    </section>
</main>
</body>
</html>
