<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ko">
<head th:replace="~{fragments/layout :: head}"></head>
<style>
    .btn-delete { padding: 5px 12px; background: #ef4444; color: #fff; border: none; border-radius: 4px; font-size: 13px; cursor: pointer; }
    .btn-delete:hover { background: #dc2626; }
    .btn-back { display: inline-block; padding: 8px 16px; background: #f1f5f9; color: #475569; border-radius: 4px; font-size: 14px; text-decoration: none; margin-bottom: 16px; }
    .btn-back:hover { background: #e2e8f0; }
</style>
<body class="dashboard-page">
<div th:replace="~{fragments/layout :: sidebar('users')}"></div>
<div class="main" id="main-content">
    <header class="page-header">
        <div class="page-heading">
            <h1 class="page-title">기기 관리</h1>
            <p class="page-description">선택한 사용자의 등록 기기와 마지막 접속 상태를 확인합니다.</p>
        </div>
    </header>
    <div class="card">
        <div class="section-heading">
            <div><h2>등록된 기기</h2><p class="section-description">기기 로그아웃 시 다음 접속에서 다시 인증해야 합니다.</p></div>
            <a th:href="@{/dashboard/users}" class="btn-back">← 사용자</a>
        </div>
        <div class="table-wrap">
        <table>
            <thead>
                <tr>
                    <th>Device ID (Machine GUID)</th>
                    <th>최초 등록 (KST)</th>
                    <th>마지막 접속 (KST)</th>
                    <th>관리</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="d : ${devices}">
                    <td th:text="${d['deviceId']}" style="font-family:var(--font-mono); font-size:13px;"></td>
                    <td th:text="${#temporals.format(d['registeredAtKst'], 'yyyy-MM-dd HH:mm:ss')}"></td>
                    <td th:text="${#temporals.format(d['lastSeenAtKst'], 'yyyy-MM-dd HH:mm:ss')}"></td>
                    <td>
                        <form th:action="@{/dashboard/users/{id}/devices/{deviceId}/delete(id=${tokenId}, deviceId=${d['deviceId']})}"
                              method="post" style="display:inline;"
                              onsubmit="return confirm('이 기기를 로그아웃하시겠습니까?')">
                            <button type="submit" class="btn-delete">로그아웃</button>
                        </form>
                    </td>
                </tr>
                <tr th:if="${#lists.isEmpty(devices)}">
                    <td colspan="4" style="text-align:center; color:#94a3b8; padding: 24px;">등록된 기기가 없습니다.</td>
                </tr>
            </tbody>
        </table>
        </div>
    </div>
</div>
</body>
</html>
