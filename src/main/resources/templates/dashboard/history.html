<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ko">
<head th:replace="~{fragments/layout :: head}"></head>
<style>
    .search-form { display:grid; grid-template-columns:repeat(auto-fit, minmax(180px, 1fr)); gap:12px; align-items:end; margin-bottom:16px; }
    .search-form input { width:100%; min-width:0; }
    .search-actions { display:flex; gap:8px; align-items:center; }
    .search-error { grid-column:1 / -1; color:#b91c1c; background:#fef2f2; border:1px solid #fecaca; border-radius:var(--radius-sm); padding:10px 12px; font-size:13px; }
    .history-charts { margin-bottom:20px; }
    .history-charts .card { margin-bottom:0; }
</style>
<body class="dashboard-page">
<div th:replace="~{fragments/layout :: sidebar('history')}"></div>
<div class="main" id="main-content">
    <header class="page-header">
        <div class="page-heading">
            <p class="page-eyebrow">Analytics</p>
            <h1 class="page-title">접근 히스토리</h1>
            <p class="page-description">서비스별 접근 흐름을 확인하고 기간, IP, 기기 단위로 이력을 추적합니다.</p>
        </div>
    </header>

    <!-- 차트 영역 -->
    <div class="dashboard-grid history-charts">
        <div class="card span-4">
            <div class="section-heading">
                <div><h2>서비스별 접근 횟수</h2><p class="section-description">현재 검색 조건을 기준으로 집계합니다.</p></div>
            </div>
            <canvas id="appChart" height="200"></canvas>
        </div>
        <div class="card span-8">
            <div class="section-heading">
                <div><h2>날짜별 접근 수</h2><p class="section-description">검색 조건을 적용한 최근 1개월의 일별 추이입니다.</p></div>
            </div>
            <canvas id="dailyChart" height="200"></canvas>
        </div>
    </div>

    <!-- 목록 -->
    <div class="card">
        <div class="section-heading">
            <div><h2>접근 기록</h2><p class="section-description">KST 기준 접속 시간과 클라이언트 식별 정보를 조회합니다.</p></div>
        </div>
        <!-- 검색 폼 -->
        <form method="get" th:action="@{/dashboard/history}" class="search-form">
            <div>
                <label for="historyAppName">애플리케이션</label>
                <input type="text" id="historyAppName" name="appName" th:value="${appName}" placeholder="앱 이름 검색…" autocomplete="off"/>
            </div>
            <div>
                <label for="historyToken">토큰</label>
                <input type="text" id="historyToken" name="tokenStr" th:value="${tokenStr}" placeholder="토큰 검색…" autocomplete="off" spellcheck="false"/>
            </div>
            <div>
                <label for="historyIp">IP</label>
                <input type="text" id="historyIp" name="ip" th:value="${ip}" placeholder="정확한 IP 입력…" autocomplete="off" spellcheck="false"/>
            </div>
            <div>
                <label for="historyDeviceId">기기 ID</label>
                <input type="text" id="historyDeviceId" name="deviceId" th:value="${deviceId}" placeholder="정확한 기기 ID 입력…" autocomplete="off" spellcheck="false"/>
            </div>
            <div>
                <label for="historyFromDate">시작일 (KST)</label>
                <input type="date" id="historyFromDate" name="fromDate" th:value="${fromDate}" th:max="${toDate}" autocomplete="off"/>
            </div>
            <div>
                <label for="historyToDate">종료일 (KST)</label>
                <input type="date" id="historyToDate" name="toDate" th:value="${toDate}" th:min="${fromDate}" autocomplete="off"/>
            </div>
            <div class="search-actions">
                <button type="submit">검색</button>
                <a th:href="@{/dashboard/history}" class="btn-reset">초기화</a>
            </div>
            <div th:if="${dateRangeError}" class="search-error" role="alert">시작일은 종료일보다 늦을 수 없습니다. 날짜 범위를 다시 확인해 주세요.</div>
        </form>

        <div class="table-wrap">
        <table>
            <thead>
                <tr>
                    <th>ID</th>
                    <th>일시 (KST)</th>
                    <th>애플리케이션</th>
                    <th>토큰</th>
                    <th>IP</th>
                    <th>기기 ID</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="h : ${histories}">
                    <td th:text="${h.id}"></td>
                    <td th:text="${#temporals.format(h.createdAtKst, 'yyyy-MM-dd HH:mm:ss')}"></td>
                    <td th:text="${appNames[h.appId] ?: h.appId}"></td>
                    <td th:text="${h.token}"></td>
                    <td th:text="${h.ip}"></td>
                    <td th:text="${h.deviceId ?: '-'}"></td>
                </tr>
                <tr th:if="${#lists.isEmpty(histories)}">
                    <td colspan="6" style="text-align:center; color:#94a3b8; padding:24px;">히스토리가 없습니다.</td>
                </tr>
            </tbody>
        </table>
        </div>

        <!-- 페이지네이션 -->
        <div class="pagination" th:if="${totalPages > 1}">
            <a th:if="${currentPage > 0}"
               th:href="@{/dashboard/history(page=${currentPage - 1}, appName=${appName}, tokenStr=${tokenStr}, ip=${ip}, deviceId=${deviceId}, fromDate=${fromDate}, toDate=${toDate})}">이전</a>
            <span th:if="${currentPage == 0}" class="disabled">이전</span>

            <a th:if="${paginationStart > 0}"
               th:href="@{/dashboard/history(page=0, appName=${appName}, tokenStr=${tokenStr}, ip=${ip}, deviceId=${deviceId}, fromDate=${fromDate}, toDate=${toDate})}">1</a>
            <span th:if="${paginationStart > 1}" class="disabled">…</span>

            <th:block th:each="i : ${#numbers.sequence(paginationStart, paginationEnd)}">
                <span th:if="${i == currentPage}" class="current" th:text="${i + 1}"></span>
                <a th:unless="${i == currentPage}"
                   th:href="@{/dashboard/history(page=${i}, appName=${appName}, tokenStr=${tokenStr}, ip=${ip}, deviceId=${deviceId}, fromDate=${fromDate}, toDate=${toDate})}"
                   th:text="${i + 1}"></a>
            </th:block>

            <span th:if="${paginationEnd < totalPages - 2}" class="disabled">…</span>
            <a th:if="${paginationEnd < totalPages - 1}"
               th:href="@{/dashboard/history(page=${totalPages - 1}, appName=${appName}, tokenStr=${tokenStr}, ip=${ip}, deviceId=${deviceId}, fromDate=${fromDate}, toDate=${toDate})}"
               th:text="${totalPages}"></a>

            <a th:if="${currentPage < totalPages - 1}"
               th:href="@{/dashboard/history(page=${currentPage + 1}, appName=${appName}, tokenStr=${tokenStr}, ip=${ip}, deviceId=${deviceId}, fromDate=${fromDate}, toDate=${toDate})}">다음</a>
            <span th:if="${currentPage >= totalPages - 1}" class="disabled">다음</span>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script th:inline="javascript">
    const appLabels  = /*[[${appAccessCounts.keySet()}]]*/ [];
    const appData    = /*[[${appAccessCounts.values()}]]*/ [];
    const dailyLabels = /*[[${dailyCounts.keySet()}]]*/ [];
    const dailyData   = /*[[${dailyCounts.values()}]]*/ [];

    const COLORS = ['#2563eb','#16a34a','#d97706','#dc2626','#7c3aed','#0891b2','#db2777'];

    new Chart(document.getElementById('appChart'), {
        type: 'doughnut',
        data: {
            labels: appLabels,
            datasets: [{
                data: appData,
                backgroundColor: COLORS.slice(0, appLabels.length),
                borderWidth: 2,
            }]
        },
        options: {
            plugins: { legend: { position: 'bottom' } },
            maintainAspectRatio: true,
        }
    });

    new Chart(document.getElementById('dailyChart'), {
        type: 'bar',
        data: {
            labels: dailyLabels,
            datasets: [{
                label: '접근 수',
                data: dailyData,
                backgroundColor: '#2563eb',
                borderRadius: 4,
            }]
        },
        options: {
            scales: {
                y: { beginAtZero: true, ticks: { stepSize: 1 } }
            },
            plugins: { legend: { display: false } },
            maintainAspectRatio: true,
        }
    });
</script>
</body>
</html>
