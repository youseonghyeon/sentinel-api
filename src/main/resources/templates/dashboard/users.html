<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ko">
<head th:replace="~{fragments/layout :: head}"></head>
<style>
    .pagination { display:flex; gap:8px; align-items:center; justify-content:center; margin-top:20px; }
    .pagination a, .pagination span { padding:6px 12px; border:1px solid #ddd; border-radius:4px; font-size:13px; text-decoration:none; color:#475569; }
    .pagination a:hover { background:#f1f5f9; }
    .pagination .current { background:#2563eb; color:#fff; border-color:#2563eb; }
    .pagination .disabled { color:#cbd5e1; pointer-events:none; }

    .modal-backdrop { position: fixed; inset: 0; background: rgba(15, 23, 42, 0.5); display: none; align-items: center; justify-content: center; z-index: 1000; }
    .modal-backdrop.open { display: flex; }
    .modal { background: #fff; border-radius: 8px; padding: 24px; min-width: 360px; box-shadow: 0 10px 30px rgba(0,0,0,0.15); }
    .modal h3 { font-size: 16px; font-weight: bold; color: #1e293b; margin-bottom: 16px; }
    .modal .row { margin-bottom: 14px; }
    .modal .row label { display: block; font-size: 13px; color: #555; margin-bottom: 6px; }
    .modal .row input { width: 100%; padding: 9px 10px; border: 1px solid #ddd; border-radius: 4px; font-size: 14px; }
    .modal .hint { font-size: 12px; color: #94a3b8; margin-top: 4px; }
    .modal .actions { display: flex; gap: 8px; justify-content: flex-end; margin-top: 20px; }
    .modal .actions button { padding: 8px 16px; font-size: 14px; border-radius: 4px; border: none; cursor: pointer; }
    .modal .btn-cancel { background: #f1f5f9; color: #475569; }
    .modal .btn-cancel:hover { background: #e2e8f0; }
    .modal .btn-submit { background: #2563eb; color: #fff; }
    .modal .btn-submit:hover { background: #1d4ed8; }

    .segmented { display: inline-flex; border: 1px solid #cbd5e1; border-radius: 6px; overflow: hidden; background: #fff; height: 42px; }
    .segmented button { padding: 0 14px; height: 100%; font-size: 13px; background: #fff; border: none; border-right: 1px solid #e2e8f0; color: #475569; cursor: pointer; font-family: inherit; transition: background .12s ease, color .12s ease; }
    .segmented button:last-child { border-right: none; }
    .segmented button:hover { background: #eff6ff; color: #2563eb; }
    .segmented button:active { background: #dbeafe; }
</style>
<body>
<div th:replace="~{fragments/layout :: sidebar('users')}"></div>
<div class="main">
    <div class="page-title">사용자 관리</div>
    <div class="alert-success" th:if="${param.success == 'token'}" style="background:#dcfce7;color:#166534;padding:12px 16px;border-radius:6px;margin-bottom:16px;">토큰이 생성되었습니다.</div>

    <div class="card">
        <h2>사용자 등록</h2>
        <form th:action="@{/dashboard/register/token}" method="post">
            <div class="form-row">
                <div>
                    <label for="appId">애플리케이션</label>
                    <select id="appId" name="appId" required style="min-width:160px;">
                        <option value="" disabled selected>앱 선택</option>
                        <option th:each="app : ${apps}" th:value="${app.id}" th:text="${app.name}"></option>
                    </select>
                </div>
                <div>
                    <label for="expireDate">만료일</label>
                    <div style="display:flex;gap:8px;align-items:center;">
                        <input type="date" id="expireDate" name="expireDate" required style="min-width:160px;">
                        <div class="segmented" role="group" aria-label="빠른 선택">
                            <button type="button" onclick="addMonths(1)">+1달</button>
                            <button type="button" onclick="addMonths(2)">+2달</button>
                            <button type="button" onclick="addMonths(3)">+3달</button>
                        </div>
                    </div>
                </div>
                <div>
                    <label for="maxDeviceCount">최대 PC 수(0 = 무제한)</label>
                    <input type="number" id="maxDeviceCount" name="maxDeviceCount" value="1" min="0" style="min-width:80px;">
                </div>
                <button type="submit">토큰 생성</button>
            </div>
        </form>
    </div>

    <div class="card">
        <form th:action="@{/dashboard/users}" method="get" style="background:#f8fafc; border:1px solid #e2e8f0; border-radius:8px; padding:18px 20px; margin-bottom:20px;">
            <div class="form-row" style="justify-content:center; align-items:flex-end;">
                <div>
                    <input type="text" id="appName" name="appName" placeholder="앱 이름 검색" th:value="${appName}" style="min-width:200px; background:#fff;">
                </div>
                <div>
                    <input type="text" id="tokenStr" name="tokenStr" placeholder="토큰 검색" th:value="${tokenStr}" style="min-width:220px; background:#fff;">
                </div>
                <button type="submit">검색</button>
                <a th:href="@{/dashboard/users}" style="padding:11px 16px; height:42px; font-size:14px; color:#64748b; text-decoration:none; display:inline-flex; align-items:center;">초기화</a>
            </div>
        </form>
        <table>
            <thead>
                <tr>
                    <th>ID</th>
                    <th>애플리케이션</th>
                    <th>토큰</th>
                    <th>만료일</th>
                    <th>최대 PC 수</th>
                    <th>활성 PC 수</th>
                    <th>상태</th>
                    <th>관리</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="token : ${tokens}">
                    <td th:text="${token.id}"></td>
                    <td th:text="${token.application.name}"></td>
                    <td th:text="${token.tokenStr}"></td>
                    <td th:text="${#temporals.format(token.expireDate, 'yyyy-MM-dd')}"></td>
                    <td th:text="${token.maxDeviceCount == 0 ? '무제한' : token.maxDeviceCount}"></td>
                    <td th:text="${activeCounts.getOrDefault(token.id, 0)}"></td>
                    <td>
                        <span th:if="${token.expireDate.isBefore(#temporals.createToday())}" class="badge badge-expired">만료</span>
                        <span th:unless="${token.expireDate.isBefore(#temporals.createToday())}" class="badge badge-ok">유효</span>
                    </td>
                    <td>
                        <div class="menu-wrap">
                            <button type="button" class="btn-more" onclick="toggleMenu(this)" aria-label="더보기">
                                <svg viewBox="0 0 24 24" fill="currentColor"><circle cx="5" cy="12" r="2"/><circle cx="12" cy="12" r="2"/><circle cx="19" cy="12" r="2"/></svg>
                            </button>
                            <div class="menu" role="menu">
                                <button type="button" class="menu-item"
                                        th:attr="data-id=${token.id},
                                                 data-expire=${#temporals.format(token.expireDate, 'yyyy-MM-dd')},
                                                 data-max=${token.maxDeviceCount}"
                                        onclick="closeAllMenus(); openEditModal(this);">
                                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"/></svg>
                                    수정
                                </button>
                                <a th:href="@{/dashboard/users/{id}/devices(id=${token.id})}" class="menu-item">
                                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="3" width="20" height="14" rx="2"/><line x1="8" y1="21" x2="16" y2="21"/><line x1="12" y1="17" x2="12" y2="21"/></svg>
                                    기기 관리
                                </a>
                                <div class="menu-divider"></div>
                                <form th:action="@{/dashboard/users/{id}/delete(id=${token.id})}" method="post" class="menu-form"
                                      onsubmit="return confirm('삭제하시겠습니까?')">
                                    <button type="submit" class="menu-item danger">
                                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/><path d="M10 11v6"/><path d="M14 11v6"/><path d="M9 6V4a2 2 0 0 1 2-2h2a2 2 0 0 1 2 2v2"/></svg>
                                        삭제
                                    </button>
                                </form>
                            </div>
                        </div>
                    </td>
                </tr>
                <tr th:if="${#lists.isEmpty(tokens)}">
                    <td colspan="8" style="text-align:center; color:#94a3b8; padding: 24px;">등록된 사용자가 없습니다.</td>
                </tr>
            </tbody>
        </table>

        <!-- 페이지네이션 -->
        <div class="pagination" th:if="${totalPages > 1}">
            <a th:if="${currentPage > 0}"
               th:href="@{/dashboard/users(page=${currentPage - 1}, appName=${appName}, tokenStr=${tokenStr})}">이전</a>
            <span th:if="${currentPage == 0}" class="disabled">이전</span>

            <th:block th:each="i : ${#numbers.sequence(0, totalPages - 1)}">
                <span th:if="${i == currentPage}" class="current" th:text="${i + 1}"></span>
                <a th:unless="${i == currentPage}"
                   th:href="@{/dashboard/users(page=${i}, appName=${appName}, tokenStr=${tokenStr})}"
                   th:text="${i + 1}"></a>
            </th:block>

            <a th:if="${currentPage < totalPages - 1}"
               th:href="@{/dashboard/users(page=${currentPage + 1}, appName=${appName}, tokenStr=${tokenStr})}">다음</a>
            <span th:if="${currentPage >= totalPages - 1}" class="disabled">다음</span>
        </div>
    </div>
</div>

<div id="editModal" class="modal-backdrop" onclick="if (event.target === this) closeEditModal()">
    <div class="modal">
        <h3>사용자 정보 수정</h3>
        <form id="editForm" method="post">
            <div class="row">
                <label for="editExpireDate">만료일</label>
                <input type="date" id="editExpireDate" name="expireDate" required>
            </div>
            <div class="row">
                <label for="editMaxDeviceCount">최대 PC 수</label>
                <input type="number" id="editMaxDeviceCount" name="maxDeviceCount" min="0" required>
                <div class="hint">0 = 무제한</div>
            </div>
            <div class="actions">
                <button type="button" class="btn-cancel" onclick="closeEditModal()">취소</button>
                <button type="submit" class="btn-submit">저장</button>
            </div>
        </form>
    </div>
</div>

<script>
    function toggleMenu(btn) {
        const menu = btn.nextElementSibling;
        const wasOpen = menu.classList.contains('open');
        closeAllMenus();
        if (!wasOpen) menu.classList.add('open');
    }
    function closeAllMenus() {
        document.querySelectorAll('.menu.open').forEach(m => m.classList.remove('open'));
    }
    document.addEventListener('click', function (e) {
        if (!e.target.closest('.menu-wrap')) closeAllMenus();
    });
    document.addEventListener('keydown', function (e) {
        if (e.key === 'Escape') closeAllMenus();
    });

    function openEditModal(btn) {
        const id = btn.dataset.id;
        document.getElementById('editExpireDate').value = btn.dataset.expire;
        document.getElementById('editMaxDeviceCount').value = btn.dataset.max;
        document.getElementById('editForm').action = '/dashboard/users/' + id + '/update';
        document.getElementById('editModal').classList.add('open');
    }
    function closeEditModal() {
        document.getElementById('editModal').classList.remove('open');
    }
    document.addEventListener('keydown', function (e) {
        if (e.key === 'Escape') closeEditModal();
    });

    function addMonths(n) {
        const d = new Date();
        d.setMonth(d.getMonth() + n);
        d.setDate(d.getDate() + 1);
        const yyyy = d.getFullYear();
        const mm = String(d.getMonth() + 1).padStart(2, '0');
        const dd = String(d.getDate()).padStart(2, '0');
        document.getElementById('expireDate').value = `${yyyy}-${mm}-${dd}`;
    }
</script>
<script th:if="${newToken != null}">
    window.onload = function() {
        alert('토큰이 생성되었습니다.\n\n애플리케이션: [[${newAppName}]]\n토큰: [[${newToken}]]\n만료일: [[${newExpireDate}]]');
    };
</script>
</body>
</html>
