<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ko">
<head th:replace="~{fragments/layout :: head}"></head>
<style>
    .filter-row { display: flex; gap: 8px; margin-bottom: 20px; }
    .filter-row a { padding: 8px 14px; border-radius: 999px; text-decoration: none; font-size: 13px; font-weight: 650; color: var(--color-text-muted); background: var(--color-surface); border: 1px solid var(--color-border); }
    .filter-row a:hover { color: var(--color-primary); border-color: #bfdbfe; background: var(--color-primary-soft); }
    .filter-row a.active { background: var(--color-primary); color: #fff; border-color: var(--color-primary); }
    .fb-card { background: var(--color-surface); border-radius: var(--radius-md); border: 1px solid var(--color-border); padding: 18px 20px; margin-bottom: 12px; box-shadow: var(--shadow-sm); }
    .fb-head { display: flex; align-items: center; gap: 10px; margin-bottom: 8px; flex-wrap: wrap; }
    .fb-kind { font-size: 11px; font-weight: 700; padding: 3px 10px; border-radius: 999px; letter-spacing: 0.04em; }
    .fb-kind.bug { background: #fee2e2; color: #991b1b; }
    .fb-kind.improvement { background: #dbeafe; color: #1e3a8a; }
    .fb-status { font-size: 11px; font-weight: 700; padding: 3px 10px; border-radius: 999px; }
    .fb-status.open { background: #fef3c7; color: #92400e; }
    .fb-status.resolved { background: #dcfce7; color: #166534; }
    .fb-meta { color: #64748b; font-size: 12px; }
    .fb-message { color: var(--color-text); white-space: pre-wrap; word-break: break-word; line-height: 1.6; font-size: 14px; padding: 10px 0; }
    .fb-foot { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-top: 8px; flex-wrap: wrap; }
    .fb-contact { font-family: var(--font-mono); font-size: 12px; color: #475569; }
    .fb-actions { display: flex; gap: 8px; }
    .fb-actions form { display: inline; }
    .fb-actions button { min-height: 34px; padding: 0 12px; border-radius: var(--radius-sm); border: 1px solid var(--color-border); background: var(--color-surface); font-size: 12px; cursor: pointer; color: var(--color-text-soft); font-family: inherit; box-shadow: none; }
    .fb-actions button:hover { background: #f8fafc; }
    .fb-actions button.primary { background: #16a34a; color: #fff; border-color: #16a34a; }
    .fb-actions button.primary:hover { background: #15803d; }
    .fb-actions button.danger { color: #dc2626; }
    .fb-actions button.danger:hover { background: #fef2f2; }
    .empty-state { text-align: center; color: #94a3b8; padding: 56px 16px; background: var(--color-surface); border: 1px dashed var(--color-border-strong); border-radius: var(--radius-md); }
</style>
<body class="dashboard-page">
<div th:replace="~{fragments/layout :: sidebar('feedbacks')}"></div>
<div class="main" id="main-content">
    <header class="page-header">
        <div class="page-heading">
            <p class="page-eyebrow">Support Inbox</p>
            <h1 class="page-title">오류 및 개선 요청</h1>
            <p class="page-description">접수된 피드백을 상태별로 확인하고 처리 이력을 관리합니다.</p>
        </div>
    </header>

    <div class="filter-row" aria-label="처리 상태 필터">
        <a th:href="@{/dashboard/feedbacks}" th:classappend="${statusFilter == ''} ? ' active'">전체</a>
        <a th:href="@{/dashboard/feedbacks(status='OPEN')}" th:classappend="${statusFilter == 'OPEN'} ? ' active'">미처리</a>
        <a th:href="@{/dashboard/feedbacks(status='RESOLVED')}" th:classappend="${statusFilter == 'RESOLVED'} ? ' active'">처리됨</a>
    </div>

    <div th:if="${#lists.isEmpty(feedbacks)}" class="empty-state">아직 접수된 피드백이 없습니다.</div>

    <div th:each="f : ${feedbacks}" class="fb-card">
        <div class="fb-head">
            <span th:if="${f.kind == 'BUG'}" class="fb-kind bug">오류</span>
            <span th:if="${f.kind == 'IMPROVEMENT'}" class="fb-kind improvement">개선</span>
            <span th:classappend="${f.status == 'OPEN'} ? ' open' : ' resolved'" class="fb-status" th:text="${f.status == 'OPEN'} ? '미처리' : '처리됨'"></span>
            <span class="fb-meta">#<span th:text="${f.id}"></span></span>
            <span class="fb-meta">·</span>
            <span class="fb-meta" th:text="${f.appId}"></span>
            <span class="fb-meta">·</span>
            <span class="fb-meta" th:text="${#temporals.format(f.createdAtKst, 'yyyy-MM-dd HH:mm')} + ' KST'"></span>
            <span class="fb-meta" th:if="${f.ip}">·</span>
            <span class="fb-meta" th:if="${f.ip}" th:text="'IP ' + ${f.ip}"></span>
        </div>
        <div class="fb-message" th:text="${f.message}"></div>
        <div class="fb-foot">
            <span class="fb-contact" th:if="${f.contact}" th:text="'연락처: ' + ${f.contact}"></span>
            <span th:unless="${f.contact}"></span>
            <div class="fb-actions">
                <form th:if="${f.status == 'OPEN'}" th:action="@{/dashboard/feedbacks/{id}/resolve(id=${f.id})}" method="post">
                    <button class="primary" type="submit">처리 완료</button>
                </form>
                <form th:if="${f.status == 'RESOLVED'}" th:action="@{/dashboard/feedbacks/{id}/reopen(id=${f.id})}" method="post">
                    <button type="submit">다시 열기</button>
                </form>
                <form th:action="@{/dashboard/feedbacks/{id}/delete(id=${f.id})}" method="post" onsubmit="return confirm('정말 삭제하시겠습니까?');">
                    <button class="danger" type="submit">삭제</button>
                </form>
            </div>
        </div>
    </div>

    <div th:if="${totalPages > 1}" class="pager">
        <a th:each="i : ${#numbers.sequence(0, totalPages - 1)}"
           th:href="@{/dashboard/feedbacks(status=${statusFilter}, page=${i})}"
           th:classappend="${i == currentPage} ? ' active'"
           th:text="${i + 1}"></a>
    </div>
</div>
</body>
</html>
