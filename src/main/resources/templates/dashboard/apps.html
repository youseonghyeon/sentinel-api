<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ko">
<head th:replace="~{fragments/layout :: head}">
<style>
    .btn-row { padding: 6px 12px; height: 30px; font-size: 13px; line-height: 1; border: none; border-radius: 4px; cursor: pointer; text-decoration: none; display: inline-flex; align-items: center; justify-content: center; box-sizing: border-box; font-family: inherit; }
    .btn-files { background: #0891b2; color: #fff; }
    .btn-files:hover { background: #0e7490; }
    .btn-delete { background: #ef4444; color: #fff; }
    .btn-delete:hover { background: #dc2626; }
    .action-cell { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
    .action-form { display: inline-flex; margin: 0; }
</style>
</head>
<body>
<div th:replace="~{fragments/layout :: sidebar('apps')}"></div>
<div class="main">
    <div class="page-title">애플리케이션 관리</div>

    <div th:if="${#strings.equals(param.success, 'app')}" style="background:#dcfce7;color:#166534;padding:12px 16px;border-radius:6px;margin-bottom:16px;">애플리케이션이 등록되었습니다.</div>

    <div class="card">
        <h2>애플리케이션 등록</h2>
        <form th:action="@{/dashboard/register/app}" method="post">
            <div class="form-row">
                <div>
                    <label for="appName">앱 이름</label>
                    <input type="text" id="appName" name="name" required style="min-width:180px;">
                </div>
                <div>
                    <label for="appDescription">설명</label>
                    <input type="text" id="appDescription" name="description" placeholder="선택 입력" style="min-width:220px;">
                </div>
                <button type="submit">앱 등록</button>
            </div>
        </form>
    </div>

    <div class="card">
        <table>
            <thead>
                <tr>
                    <th>ID</th>
                    <th>앱 이름</th>
                    <th>App ID</th>
                    <th>설명</th>
                    <th>관리</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="app : ${apps}">
                    <td th:text="${app.id}"></td>
                    <td th:text="${app.name}"></td>
                    <td th:text="${app.appId}" style="font-family:monospace;"></td>
                    <td th:text="${app.description}"></td>
                    <td>
                        <div class="action-cell">
                            <a th:href="@{/dashboard/apps/{id}/files(id=${app.id})}" class="btn-row btn-files">파일 관리</a>
                            <form th:action="@{/dashboard/apps/{id}/delete(id=${app.id})}" method="post" class="action-form"
                                  onsubmit="return confirm('삭제하시겠습니까? 연결된 토큰도 함께 삭제됩니다.')">
                                <button type="submit" class="btn-row btn-delete">삭제</button>
                            </form>
                        </div>
                    </td>
                </tr>
                <tr th:if="${#lists.isEmpty(apps)}">
                    <td colspan="5" style="text-align:center; color:#94a3b8; padding: 24px;">등록된 애플리케이션이 없습니다.</td>
                </tr>
            </tbody>
        </table>
    </div>
</div>
</body>
</html>
