<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ko">
<head th:replace="~{fragments/layout :: head}"></head>
<style>
    .btn-row { padding: 6px 12px; height: 30px; font-size: 13px; line-height: 1; border: none; border-radius: 4px; cursor: pointer; text-decoration: none; display: inline-flex; align-items: center; justify-content: center; box-sizing: border-box; font-family: inherit; }
    .btn-latest { background: #16a34a; color: #fff; }
    .btn-latest:hover { background: #15803d; }
    .btn-delete { background: #ef4444; color: #fff; }
    .btn-delete:hover { background: #dc2626; }
    .btn-back { background: #f1f5f9; color: #475569; padding: 6px 14px; border-radius: 4px; text-decoration: none; font-size: 13px; display: inline-flex; align-items: center; height: 30px; }
    .btn-back:hover { background: #e2e8f0; }
    .action-cell { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
    .action-form { display: inline-flex; margin: 0; }
    .mono { font-family: var(--font-mono); font-size: 12px; color: #64748b; }
    .sha { display: inline-block; max-width: 220px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; vertical-align: middle; }
    .latest-badge { display: inline-block; padding: 2px 8px; background: #dcfce7; color: #166534; border-radius: 12px; font-size: 12px; margin-left: 6px; }
    textarea { padding: 10px 12px; border: 1px solid #ddd; border-radius: 4px; font-size: 14px; font-family: inherit; resize: vertical; min-height: 60px; width: 100%; box-sizing: border-box; }
    input[type=file] { height: 42px; padding: 0 14px 0 0; border: 1px solid #ddd; border-radius: 4px; font-size: 14px; background: #fff; box-sizing: border-box; cursor: pointer; display: inline-flex; align-items: center; font-family: inherit; color: #334155; overflow: hidden; line-height: 1; }
    input[type=file]::file-selector-button { height: 100%; padding: 0 16px; margin: 0 12px 0 0; background: #f1f5f9; color: #475569; border: none; border-right: 1px solid #e2e8f0; border-radius: 0; font-size: 13px; cursor: pointer; font-family: inherit; display: inline-flex; align-items: center; }
    input[type=file]::file-selector-button:hover { background: #e2e8f0; }
    .upload-form .field { margin-bottom: 14px; }
    .upload-form .field:last-of-type { margin-bottom: 0; }
    .upload-form textarea { max-width: 640px; }
    .upload-row { display: flex; gap: 12px; align-items: flex-end; flex-wrap: wrap; }
</style>
<body>
<div th:replace="~{fragments/layout :: sidebar('apps')}"></div>
<div class="main">
    <div style="display:flex; align-items:center; gap:12px; margin-bottom:24px;">
        <a th:href="@{/dashboard/apps}" class="btn-back">← 목록</a>
        <div class="page-title" style="margin:0;">
            파일 관리 · <span th:text="${app.name}"></span>
            <span class="mono" style="font-size:13px; margin-left:8px;" th:text="${app.appId}"></span>
        </div>
    </div>

    <div th:if="${param.success == 'upload'}" style="background:#dcfce7;color:#166534;padding:12px 16px;border-radius:6px;margin-bottom:16px;">파일이 업로드되었습니다.</div>
    <div th:if="${param.success == 'latest'}" style="background:#dcfce7;color:#166534;padding:12px 16px;border-radius:6px;margin-bottom:16px;">최신 버전이 변경되었습니다.</div>
    <div th:if="${param.success == 'delete'}" style="background:#fef9c3;color:#854d0e;padding:12px 16px;border-radius:6px;margin-bottom:16px;">파일이 삭제되었습니다.</div>
    <div th:if="${error}" style="background:#fee2e2;color:#991b1b;padding:12px 16px;border-radius:6px;margin-bottom:16px;" th:text="${error}"></div>

    <div class="card">
        <h2>새 버전 업로드</h2>
        <form class="upload-form" th:action="@{/dashboard/apps/{id}/files(id=${app.id})}" method="post" enctype="multipart/form-data">
            <div class="field">
                <label for="version">버전</label>
                <input type="text" id="version" name="version" placeholder="예: 1.0.0" required style="min-width:200px;">
            </div>
            <div class="field">
                <label for="changelog">변경 내역 (선택)</label>
                <textarea id="changelog" name="changelog" placeholder="이번 버전의 변경사항을 적어주세요."></textarea>
            </div>
            <div class="field">
                <label for="file">파일</label>
                <div class="upload-row">
                    <input type="file" id="file" name="file" required style="min-width:360px;">
                    <button type="submit">업로드</button>
                </div>
            </div>
        </form>
    </div>

    <div class="card">
        <h2>버전 목록</h2>
        <table>
            <thead>
                <tr>
                    <th>버전</th>
                    <th>파일명</th>
                    <th>크기</th>
                    <th>SHA-256</th>
                    <th>업로드일시(KST)</th>
                    <th>관리</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="f : ${files}">
                    <td>
                        <span th:text="${f.version}"></span>
                        <span th:if="${f.isLatest}" class="latest-badge">LATEST</span>
                    </td>
                    <td th:text="${f.filename}"></td>
                    <td><span class="size-value" th:attr="data-bytes=${f.sizeBytes}"></span></td>
                    <td><span class="mono sha" th:text="${f.sha256}" th:title="${f.sha256}"></span></td>
                    <td th:text="${#temporals.format(f.uploadedAt.atZone(T(java.time.ZoneOffset).UTC).withZoneSameInstant(T(java.time.ZoneId).of('Asia/Seoul')).toLocalDateTime(), 'yyyy-MM-dd HH:mm')}"></td>
                    <td>
                        <div class="action-cell">
                            <form th:unless="${f.isLatest}" th:action="@{/dashboard/apps/{appId}/files/{fileId}/latest(appId=${app.id}, fileId=${f.id})}" method="post" class="action-form">
                                <button type="submit" class="btn-row btn-latest">최신으로 지정</button>
                            </form>
                            <form th:action="@{/dashboard/apps/{appId}/files/{fileId}/delete(appId=${app.id}, fileId=${f.id})}" method="post" class="action-form"
                                  onsubmit="return confirm('삭제하시겠습니까? 파일도 함께 제거됩니다.')">
                                <button type="submit" class="btn-row btn-delete">삭제</button>
                            </form>
                        </div>
                    </td>
                </tr>
                <tr th:if="${#lists.isEmpty(files)}">
                    <td colspan="6" style="text-align:center; color:#94a3b8; padding:24px;">등록된 파일이 없습니다.</td>
                </tr>
            </tbody>
        </table>
    </div>
</div>
<script>
    function formatSize(n) {
        if (n >= 1024 * 1024 * 1024) return (n / (1024 * 1024 * 1024)).toFixed(2) + ' GB';
        if (n >= 1024 * 1024) return (n / (1024 * 1024)).toFixed(2) + ' MB';
        if (n >= 1024) return (n / 1024).toFixed(2) + ' KB';
        return n.toLocaleString() + ' B';
    }
    document.querySelectorAll('.size-value').forEach(el => {
        el.textContent = formatSize(Number(el.dataset.bytes));
    });
</script>
</body>
</html>
