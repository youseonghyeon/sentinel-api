<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ko">
<head th:replace="~{fragments/layout :: head}"></head>
<body>
<div th:replace="~{fragments/layout :: sidebar('register')}"></div>
<div class="main">
    <div class="page-title">등록</div>

    <div th:if="${#strings.equals(param.success, 'app')}"     style="background:#dcfce7;color:#166534;padding:12px 16px;border-radius:6px;margin-bottom:16px;">애플리케이션이 등록되었습니다.</div>
    <div th:if="${#strings.equals(param.success, 'manager')}" style="background:#dcfce7;color:#166534;padding:12px 16px;border-radius:6px;margin-bottom:16px;">매니저가 등록되었습니다.</div>
    <!-- 애플리케이션 등록 -->
    <div class="card">
        <h2>애플리케이션 등록</h2>
        <form th:action="@{/dashboard/register/app}" method="post">
            <div class="form-row">
                <div>
                    <label for="appName">앱 이름</label>
                    <input type="text" id="appName" name="name" required style="min-width:180px;">
                </div>
                <div>
                    <label for="appDescription">설명</label>
                    <input type="text" id="appDescription" name="description" placeholder="선택 입력" style="min-width:220px;">
                </div>
                <button type="submit">앱 등록</button>
            </div>
        </form>
    </div>

    <!-- 사용자(토큰) 등록 -->
    <div class="card">
        <h2>사용자 등록</h2>
        <form th:action="@{/dashboard/register/token}" method="post">
            <div class="form-row">
                <div>
                    <label for="appId">애플리케이션</label>
                    <select id="appId" name="appId" required style="min-width:160px;">
                        <option value="" disabled selected>앱 선택</option>
                        <option th:each="app : ${apps}" th:value="${app.id}" th:text="${app.name}"></option>
                    </select>
                </div>
                <div>
                    <label for="expireDate">만료일</label>
                    <div style="display:flex;gap:6px;align-items:center;">
                        <input type="date" id="expireDate" name="expireDate" required style="min-width:160px;">
                        <button type="button" onclick="addMonths(1)" style="padding:6px 10px;font-size:12px;background:#f1f5f9;border:1px solid #ddd;border-radius:4px;cursor:pointer;">+1달</button>
                        <button type="button" onclick="addMonths(2)" style="padding:6px 10px;font-size:12px;background:#f1f5f9;border:1px solid #ddd;border-radius:4px;cursor:pointer;">+2달</button>
                        <button type="button" onclick="addMonths(3)" style="padding:6px 10px;font-size:12px;background:#f1f5f9;border:1px solid #ddd;border-radius:4px;cursor:pointer;">+3달</button>
                    </div>
                </div>
                <button type="submit">토큰 생성</button>
            </div>
        </form>
    </div>

    <!-- 매니저 등록 -->
    <div class="card">
        <h2>매니저 등록</h2>
        <form th:action="@{/dashboard/register/manager}" method="post">
            <div class="form-row">
                <div>
                    <label for="username">아이디</label>
                    <input type="text" id="username" name="username" required style="min-width:160px;">
                </div>
                <div>
                    <label for="password">비밀번호</label>
                    <input type="password" id="password" name="password" required style="min-width:160px;">
                </div>
                <button type="submit">매니저 등록</button>
            </div>
        </form>
    </div>
</div>
<script>
    function addMonths(n) {
        const d = new Date();
        d.setMonth(d.getMonth() + n);
        d.setDate(d.getDate() + 1);
        const yyyy = d.getFullYear();
        const mm = String(d.getMonth() + 1).padStart(2, '0');
        const dd = String(d.getDate()).padStart(2, '0');
        document.getElementById('expireDate').value = `${yyyy}-${mm}-${dd}`;
    }
</script>
<script th:if="${newToken != null}">
    window.onload = function() {
        alert('토큰이 생성되었습니다.\n\n애플리케이션: [[${newAppName}]]\n토큰: [[${newToken}]]\n만료일: [[${newExpireDate}]]');
    };
</script>
</body>
</html>
