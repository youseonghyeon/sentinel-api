<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Sentinel · 다운로드</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        html, body { height: 100%; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans KR", "Malgun Gothic", sans-serif;
            background: #f8fafc;
            color: #0f172a;
            -webkit-font-smoothing: antialiased;
            line-height: 1.5;
        }

        .brand-bar { padding: 20px 24px; display: flex; align-items: center; gap: 10px; color: #475569; }
        .brand-bar .mark { width: 24px; height: 24px; border-radius: 6px; background: linear-gradient(135deg, #2563eb, #7c3aed); display: inline-block; }
        .brand-bar .name { font-weight: 700; font-size: 15px; letter-spacing: 0.01em; color: #1e293b; }

        .wrap { max-width: 680px; margin: 8px auto 64px; padding: 0 20px; }

        .hero {
            background: linear-gradient(135deg, #1e3a8a 0%, #4338ca 55%, #6d28d9 100%);
            color: #fff;
            border-radius: 16px;
            padding: 32px 32px 28px;
            box-shadow: 0 10px 30px -10px rgba(67, 56, 202, 0.35);
            margin-bottom: 20px;
        }
        .hero .tag { font-size: 12px; text-transform: uppercase; letter-spacing: 0.15em; color: rgba(255,255,255,0.7); margin-bottom: 10px; }
        .hero h1 { font-size: 28px; font-weight: 700; line-height: 1.2; margin-bottom: 10px; word-break: break-word; }
        .hero .desc { font-size: 15px; color: rgba(255,255,255,0.85); margin-bottom: 18px; }
        .hero .chip {
            display: inline-flex; align-items: center; gap: 6px;
            padding: 6px 12px; border-radius: 999px;
            background: rgba(255,255,255,0.12); backdrop-filter: blur(4px);
            font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
            font-size: 12px; color: rgba(255,255,255,0.92);
            border: 1px solid rgba(255,255,255,0.18);
        }
        .hero .chip svg { width: 12px; height: 12px; opacity: 0.85; }

        .hero.notfound { background: linear-gradient(135deg, #991b1b 0%, #7f1d1d 100%); box-shadow: 0 10px 30px -10px rgba(153, 27, 27, 0.35); }

        .card {
            background: #fff;
            border-radius: 14px;
            padding: 20px 24px;
            box-shadow: 0 1px 2px rgba(15, 23, 42, 0.04), 0 4px 16px -8px rgba(15, 23, 42, 0.08);
            border: 1px solid rgba(15, 23, 42, 0.04);
            margin-bottom: 16px;
        }

        .token-card { padding: 20px 24px; }
        .token-card label { display: flex; align-items: center; gap: 6px; font-size: 13px; font-weight: 600; color: #334155; margin-bottom: 10px; }
        .token-card label svg { width: 14px; height: 14px; color: #64748b; }
        .token-input-wrap { position: relative; }
        .token-input-wrap input {
            width: 100%; padding: 12px 44px 12px 14px;
            border: 1.5px solid #e2e8f0; border-radius: 10px;
            font-size: 14px; font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
            transition: border-color .15s ease, box-shadow .15s ease;
            background: #fff;
        }
        .token-input-wrap input:focus { outline: none; border-color: #4338ca; box-shadow: 0 0 0 4px rgba(67, 56, 202, 0.12); }
        .token-toggle { position: absolute; right: 8px; top: 50%; transform: translateY(-50%); background: transparent; border: none; padding: 8px; cursor: pointer; color: #94a3b8; border-radius: 6px; display: flex; }
        .token-toggle:hover { color: #334155; background: #f1f5f9; }
        .token-toggle svg { width: 18px; height: 18px; }

        .error { background: #fef2f2; color: #991b1b; border: 1px solid #fecaca; padding: 12px 16px; border-radius: 10px; margin-bottom: 16px; font-size: 14px; display: flex; align-items: center; gap: 8px; }
        .error svg { width: 16px; height: 16px; flex-shrink: 0; }

        .version-card {
            background: #fff;
            border-radius: 14px;
            padding: 22px 24px;
            box-shadow: 0 1px 2px rgba(15, 23, 42, 0.04), 0 4px 16px -8px rgba(15, 23, 42, 0.08);
            border: 1px solid rgba(15, 23, 42, 0.04);
            margin-bottom: 14px;
            transition: box-shadow .18s ease, transform .18s ease;
        }
        .version-card:hover { box-shadow: 0 1px 2px rgba(15, 23, 42, 0.04), 0 10px 28px -10px rgba(15, 23, 42, 0.14); transform: translateY(-1px); }

        .version-top { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 14px; flex-wrap: wrap; }
        .version-head { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
        .version-num { font-size: 20px; font-weight: 700; color: #0f172a; letter-spacing: -0.01em; }
        .badge-latest {
            display: inline-flex; align-items: center; gap: 4px;
            padding: 3px 10px; border-radius: 999px;
            background: linear-gradient(135deg, #10b981, #059669);
            color: #fff; font-size: 11px; font-weight: 700; letter-spacing: 0.04em;
        }

        .btn-download {
            display: inline-flex; align-items: center; gap: 8px;
            padding: 10px 18px;
            background: linear-gradient(135deg, #2563eb, #4338ca);
            color: #fff; border: none; border-radius: 10px;
            font-size: 14px; font-weight: 600; cursor: pointer;
            box-shadow: 0 6px 18px -8px rgba(67, 56, 202, 0.5);
            transition: transform .12s ease, box-shadow .12s ease, filter .12s ease;
            font-family: inherit;
        }
        .btn-download:hover { transform: translateY(-1px); box-shadow: 0 10px 22px -10px rgba(67, 56, 202, 0.65); filter: brightness(1.05); }
        .btn-download:active { transform: translateY(0); }
        .btn-download svg { width: 16px; height: 16px; }

        .version-filename { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 13px; color: #334155; background: #f8fafc; padding: 8px 12px; border-radius: 8px; border: 1px solid #e2e8f0; word-break: break-all; margin-bottom: 12px; }

        .meta-list { display: flex; flex-direction: column; gap: 8px; font-size: 13px; }
        .meta-row { display: flex; align-items: center; gap: 10px; color: #475569; }
        .meta-label { color: #94a3b8; font-size: 12px; text-transform: uppercase; letter-spacing: 0.06em; font-weight: 600; min-width: 72px; }
        .meta-value { color: #334155; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 13px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 320px; }
        .meta-value.plain { font-family: inherit; }
        .copy-btn { background: transparent; border: none; color: #94a3b8; padding: 4px; cursor: pointer; border-radius: 4px; display: inline-flex; }
        .copy-btn:hover { color: #334155; background: #f1f5f9; }
        .copy-btn svg { width: 14px; height: 14px; }
        .copy-btn.copied { color: #059669; }

        .changelog { margin-top: 14px; padding: 12px 14px; background: #f8fafc; border-radius: 10px; border-left: 3px solid #4338ca; }
        .changelog-label { font-size: 11px; font-weight: 700; color: #4338ca; letter-spacing: 0.08em; margin-bottom: 6px; text-transform: uppercase; }
        .changelog-text { font-size: 13px; color: #334155; line-height: 1.6; white-space: pre-wrap; word-break: break-word; }

        .empty { text-align: center; color: #94a3b8; padding: 56px 20px; background: #fff; border-radius: 14px; box-shadow: 0 1px 2px rgba(15, 23, 42, 0.04); border: 1px dashed #cbd5e1; font-size: 14px; }
        .empty svg { width: 40px; height: 40px; color: #cbd5e1; margin: 0 auto 12px; display: block; }

        .footer { text-align: center; color: #94a3b8; font-size: 12px; margin-top: 32px; }

        @media (max-width: 540px) {
            .hero { padding: 24px 22px 22px; }
            .hero h1 { font-size: 22px; }
            .card, .version-card { padding: 18px 18px; }
            .meta-value { max-width: 180px; }
        }
    </style>
</head>
<body>
<div class="brand-bar">
    <span class="mark"></span>
    <span class="name">Sentinel</span>
</div>
<div class="wrap">

    <div th:if="${notFound}" class="hero notfound">
        <div class="tag">NOT FOUND</div>
        <h1>애플리케이션을 찾을 수 없습니다</h1>
        <div class="desc">요청하신 애플리케이션 ID가 존재하지 않거나 삭제되었습니다.</div>
        <span class="chip" th:text="${appIdInput}"></span>
    </div>

    <div th:unless="${notFound}">
        <div class="hero">
            <div class="tag">APPLICATION</div>
            <h1 th:text="${app.name}"></h1>
            <div class="desc" th:if="${app.description != null and !#strings.isEmpty(app.description)}" th:text="${app.description}"></div>
            <span class="chip">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M3 9h18"/></svg>
                <span th:text="${app.appId}"></span>
            </span>
        </div>

        <div th:if="${error}" class="error">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
            <span th:text="${error}"></span>
        </div>

        <div class="card token-card">
            <label for="token">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
                토큰
            </label>
            <div class="token-input-wrap">
                <input type="password" id="token" placeholder="발급받은 토큰을 입력하세요" autocomplete="off" spellcheck="false">
                <button type="button" class="token-toggle" onclick="toggleToken()" aria-label="토큰 표시">
                    <svg id="eye-on" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
                    <svg id="eye-off" style="display:none;" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17.94 17.94A10.94 10.94 0 0 1 12 20c-7 0-11-8-11-8a19.77 19.77 0 0 1 5.06-5.94M9.9 4.24A10.94 10.94 0 0 1 12 4c7 0 11 8 11 8a19.77 19.77 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/></svg>
                </button>
            </div>
        </div>

        <div th:if="${#lists.isEmpty(files)}" class="empty">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>
            아직 업로드된 파일이 없습니다.
        </div>

        <form th:each="f : ${files}"
              th:action="@{/download/{appId}/{version}(appId=${app.appId}, version=${f.version})}"
              method="post"
              onsubmit="return attachToken(this)">
            <input type="hidden" name="token">
            <div class="version-card">
                <div class="version-top">
                    <div class="version-head">
                        <span class="version-num" th:text="${f.version}"></span>
                        <span th:if="${f.isLatest}" class="badge-latest">LATEST</span>
                    </div>
                    <button type="submit" class="btn-download">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
                        다운로드
                    </button>
                </div>
                <div class="version-filename" th:text="${f.filename}"></div>
                <div class="meta-list">
                    <div class="meta-row">
                        <span class="meta-label">크기</span>
                        <span class="meta-value plain size-value" th:attr="data-bytes=${f.sizeBytes}"></span>
                    </div>
                    <div class="meta-row">
                        <span class="meta-label">SHA-256</span>
                        <span class="meta-value" th:text="${f.sha256}" th:title="${f.sha256}"></span>
                        <button type="button" class="copy-btn" th:attr="data-copy=${f.sha256}" onclick="copyText(this)" aria-label="SHA-256 복사">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>
                        </button>
                    </div>
                    <div class="meta-row">
                        <span class="meta-label">업로드</span>
                        <span class="meta-value plain" th:text="${#temporals.format(f.uploadedAt.atZone(T(java.time.ZoneOffset).UTC).withZoneSameInstant(T(java.time.ZoneId).of('Asia/Seoul')).toLocalDateTime(), 'yyyy-MM-dd HH:mm')} + ' KST'"></span>
                    </div>
                </div>
                <div th:if="${f.changelog != null and !#strings.isEmpty(f.changelog)}" class="changelog">
                    <div class="changelog-label">변경 내역</div>
                    <div class="changelog-text" th:text="${f.changelog}"></div>
                </div>
            </div>
        </form>

        <div class="footer">Powered by Sentinel</div>
    </div>
</div>
<script>
    function attachToken(form) {
        const token = document.getElementById('token').value.trim();
        if (!token) {
            alert('토큰을 입력해주세요.');
            return false;
        }
        form.querySelector('input[name=token]').value = token;
        return true;
    }
    function toggleToken() {
        const input = document.getElementById('token');
        const on = document.getElementById('eye-on');
        const off = document.getElementById('eye-off');
        if (input.type === 'password') {
            input.type = 'text';
            on.style.display = 'none';
            off.style.display = '';
        } else {
            input.type = 'password';
            on.style.display = '';
            off.style.display = 'none';
        }
    }
    function copyText(btn) {
        const text = btn.dataset.copy;
        navigator.clipboard.writeText(text).then(() => {
            btn.classList.add('copied');
            setTimeout(() => btn.classList.remove('copied'), 1200);
        });
    }
    function formatSize(n) {
        if (n >= 1024 * 1024 * 1024) return (n / (1024 * 1024 * 1024)).toFixed(2) + ' GB';
        if (n >= 1024 * 1024) return (n / (1024 * 1024)).toFixed(2) + ' MB';
        if (n >= 1024) return (n / 1024).toFixed(2) + ' KB';
        return n.toLocaleString() + ' B';
    }
    document.querySelectorAll('.size-value').forEach(el => {
        el.textContent = formatSize(Number(el.dataset.bytes));
    });
</script>
</body>
</html>
