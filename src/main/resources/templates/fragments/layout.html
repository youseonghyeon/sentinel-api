<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ko">
<head th:fragment="head">
    <meta charset="UTF-8">
    <title>Sentinel</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/app.css}">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { background: #f5f5f5; display: flex; height: 100vh; }

        .sidebar { width: 220px; background: #1e293b; color: #fff; display: flex; flex-direction: column; flex-shrink: 0; }
        .sidebar-title { padding: 24px 20px 16px; font-size: 18px; font-weight: bold; border-bottom: 1px solid #334155; }
        .sidebar nav { flex: 1; padding: 12px 0; }
        .sidebar nav a { display: block; padding: 12px 20px; color: #cbd5e1; text-decoration: none; font-size: 14px; }
        .sidebar nav a:hover, .sidebar nav a.active { background: #334155; color: #fff; }
        .sidebar-footer { padding: 16px 20px; border-top: 1px solid #334155; }
        .sidebar-footer a { color: #94a3b8; font-size: 13px; text-decoration: none; }
        .sidebar-footer a:hover { color: #fff; }

        .main { flex: 1; overflow-y: auto; padding: 32px; }
        .page-title { font-size: 20px; font-weight: bold; color: #1e293b; margin-bottom: 24px; }

        .card { background: #fff; border-radius: 8px; box-shadow: 0 1px 6px rgba(0,0,0,0.08); padding: 24px; margin-bottom: 24px; }
        .card h2 { font-size: 15px; font-weight: bold; color: #334155; margin-bottom: 16px; }

        .form-row { display: flex; gap: 12px; flex-wrap: wrap; align-items: flex-end; }
        label { display: block; font-size: 13px; color: #555; margin-bottom: 6px; }
        input, select { padding: 11px 12px; height: 42px; border: 1px solid #ddd; border-radius: 4px; font-size: 14px; min-width: 160px; font-family: inherit; color: #0f172a; background: #fff; }
        select {
            min-width: 200px;
            appearance: none;
            -webkit-appearance: none;
            -moz-appearance: none;
            padding-right: 36px;
            background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='12' height='8' viewBox='0 0 12 8' fill='none'><path d='M1 1.5L6 6.5L11 1.5' stroke='%2364748b' stroke-width='1.6' stroke-linecap='round' stroke-linejoin='round'/></svg>");
            background-repeat: no-repeat;
            background-position: right 12px center;
        }
        select::-ms-expand { display: none; }
        button[type=submit] { padding: 11px 20px; background: #2563eb; color: #fff; border: none; border-radius: 4px; font-size: 14px; cursor: pointer; }
        button[type=submit]:hover { background: #1d4ed8; }

        table { width: 100%; border-collapse: collapse; font-size: 14px; }
        thead tr { background: #f1f5f9; }
        th, td { padding: 10px 14px; text-align: left; border-bottom: 1px solid #e2e8f0; }
        th { font-weight: 600; color: #475569; }
        .badge { display: inline-block; padding: 2px 8px; border-radius: 12px; font-size: 12px; }
        .badge-ok { background: #dcfce7; color: #166534; }
        .badge-expired { background: #fee2e2; color: #991b1b; }

        /* Dropdown menu (row actions) */
        .menu-wrap { position: relative; display: inline-block; }
        .btn-more { width: 30px; height: 30px; border: 1px solid #e2e8f0; background: #fff; border-radius: 6px; cursor: pointer; display: inline-flex; align-items: center; justify-content: center; color: #64748b; padding: 0; transition: background .12s ease, color .12s ease, border-color .12s ease; }
        .btn-more:hover { background: #f8fafc; color: #334155; border-color: #cbd5e1; }
        .btn-more svg { width: 16px; height: 16px; }
        .menu { position: absolute; top: calc(100% + 6px); left: 50%; transform: translateX(-50%); min-width: 170px; background: #fff; border: 1px solid #e2e8f0; border-radius: 8px; box-shadow: 0 12px 28px -8px rgba(15, 23, 42, 0.18), 0 2px 6px rgba(15, 23, 42, 0.06); padding: 6px; z-index: 100; display: none; }
        .menu.open { display: block; }
        .menu .menu-form { margin: 0; display: block; }
        .menu .menu-item { display: flex; align-items: center; gap: 8px; width: 100%; padding: 8px 10px; background: transparent; border: none; border-radius: 6px; font-size: 13px; color: #334155; cursor: pointer; text-align: left; text-decoration: none; font-family: inherit; box-sizing: border-box; line-height: 1.2; }
        .menu .menu-item:hover { background: #f1f5f9; color: #0f172a; }
        .menu .menu-item.danger { color: #dc2626; background: transparent; }
        .menu .menu-item.danger:hover { background: #fef2f2; color: #b91c1c; }
        .menu .menu-item svg { width: 14px; height: 14px; color: #94a3b8; flex-shrink: 0; }
        .menu .menu-item:hover svg { color: #475569; }
        .menu .menu-item.danger svg { color: #ef4444; }
        .menu .menu-item.danger:hover svg { color: #b91c1c; }
        .menu-divider { height: 1px; background: #e2e8f0; margin: 4px 2px; }
    </style>
</head>
<body>
<div th:fragment="sidebar(activePage)" class="sidebar">
    <div class="sidebar-title">Sentinel</div>
    <nav>
        <a th:href="@{/dashboard/apps}"     th:classappend="${activePage == 'apps'}     ? ' active'">애플리케이션 관리</a>
        <a th:href="@{/dashboard/users}"    th:classappend="${activePage == 'users'}    ? ' active'">사용자 관리</a>
        <a th:href="@{/dashboard/history}"  th:classappend="${activePage == 'history'}  ? ' active'">사용자 히스토리</a>
        <a th:href="@{/dashboard/apikeys}"  th:classappend="${activePage == 'apikeys'}  ? ' active'">매니저 관리</a>
        <a th:href="@{/dashboard/api-docs}" th:classappend="${activePage == 'api-docs'} ? ' active'">API 명세</a>
    </nav>
    <div class="sidebar-footer">
        <a th:href="@{/logout}">로그아웃</a>
    </div>
</div>
</body>
</html>
