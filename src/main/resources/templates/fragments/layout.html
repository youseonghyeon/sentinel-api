<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ko">
<head th:fragment="head">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#f6f8fa">
    <title>Sentinel Admin</title>
    <link rel="stylesheet" th:href="@{/css/app.css}">
    <script th:src="@{/js/app.js}" defer></script>
</head>
<body>
<aside th:fragment="sidebar(activePage)" class="sidebar" aria-label="주요 메뉴">
    <a class="skip-link" href="#main-content">본문으로 바로가기</a>

    <div class="sidebar-brand">
        <span class="brand-mark" aria-hidden="true">S</span>
        <div class="brand-copy">
            <span class="brand-title">Sentinel</span>
            <span class="brand-subtitle">관리자 콘솔</span>
        </div>
        <button class="sidebar-toggle" type="button" aria-label="메뉴 열기" aria-expanded="false" aria-controls="sidebar-navigation">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true">
                <path d="M4 7h16M4 12h16M4 17h16"/>
            </svg>
        </button>
    </div>

    <nav id="sidebar-navigation" class="sidebar-nav">
        <p class="nav-label">관리</p>
        <a th:href="@{/dashboard/apps}" th:classappend="${activePage == 'apps'} ? ' active'">
            <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true">
                <rect x="3" y="3" width="7" height="7" rx="2"/><rect x="14" y="3" width="7" height="7" rx="2"/><rect x="3" y="14" width="7" height="7" rx="2"/><rect x="14" y="14" width="7" height="7" rx="2"/>
            </svg>
            <span class="nav-text">애플리케이션</span>
        </a>
        <a th:href="@{/dashboard/users}" th:classappend="${activePage == 'users'} ? ' active'">
            <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true">
                <path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75"/>
            </svg>
            <span class="nav-text">사용자</span>
        </a>
        <a th:href="@{/dashboard/history}" th:classappend="${activePage == 'history'} ? ' active'">
            <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true">
                <path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5M12 7v5l3 2"/>
            </svg>
            <span class="nav-text">접근 히스토리</span>
        </a>
        <a th:href="@{/dashboard/feedbacks}" th:classappend="${activePage == 'feedbacks'} ? ' active'">
            <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true">
                <path d="M21 15a4 4 0 0 1-4 4H8l-5 3V7a4 4 0 0 1 4-4h10a4 4 0 0 1 4 4z"/>
            </svg>
            <span class="nav-text">오류 및 개선 요청</span>
            <span th:if="${openFeedbackCount != null and openFeedbackCount > 0}" class="nav-badge" th:text="${openFeedbackCount}"></span>
        </a>

        <p class="nav-label">시스템</p>
        <a th:href="@{/dashboard/apikeys}" th:classappend="${activePage == 'apikeys'} ? ' active'">
            <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true">
                <circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/>
            </svg>
            <span class="nav-text">매니저 및 API 키</span>
        </a>
        <a th:href="@{/dashboard/api-docs}" th:classappend="${activePage == 'api-docs'} ? ' active'">
            <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true">
                <path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/>
            </svg>
            <span class="nav-text">API 명세</span>
        </a>
    </nav>

    <div class="sidebar-footer">
        <a th:href="@{/logout}">
            <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true">
                <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4M16 17l5-5-5-5M21 12H9"/>
            </svg>
            로그아웃
        </a>
    </div>
</aside>
</body>
</html>
