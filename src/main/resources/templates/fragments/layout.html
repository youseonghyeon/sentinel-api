<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ko">
<head th:fragment="head">
    <meta charset="UTF-8">
    <title>Sentinel</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: sans-serif; background: #f5f5f5; display: flex; height: 100vh; }

        .sidebar { width: 220px; background: #1e293b; color: #fff; display: flex; flex-direction: column; flex-shrink: 0; }
        .sidebar-title { padding: 24px 20px 16px; font-size: 18px; font-weight: bold; border-bottom: 1px solid #334155; }
        .sidebar nav { flex: 1; padding: 12px 0; }
        .sidebar nav a { display: block; padding: 12px 20px; color: #cbd5e1; text-decoration: none; font-size: 14px; }
        .sidebar nav a:hover, .sidebar nav a.active { background: #334155; color: #fff; }
        .sidebar-footer { padding: 16px 20px; border-top: 1px solid #334155; }
        .sidebar-footer a { color: #94a3b8; font-size: 13px; text-decoration: none; }
        .sidebar-footer a:hover { color: #fff; }

        .main { flex: 1; overflow-y: auto; padding: 32px; }
        .page-title { font-size: 20px; font-weight: bold; color: #1e293b; margin-bottom: 24px; }

        .card { background: #fff; border-radius: 8px; box-shadow: 0 1px 6px rgba(0,0,0,0.08); padding: 24px; margin-bottom: 24px; }
        .card h2 { font-size: 15px; font-weight: bold; color: #334155; margin-bottom: 16px; }

        .form-row { display: flex; gap: 12px; flex-wrap: wrap; align-items: flex-end; }
        label { display: block; font-size: 13px; color: #555; margin-bottom: 6px; }
        input, select { padding: 9px 12px; border: 1px solid #ddd; border-radius: 4px; font-size: 14px; min-width: 160px; }
        select { min-width: 200px; }
        button[type=submit] { padding: 9px 20px; background: #2563eb; color: #fff; border: none; border-radius: 4px; font-size: 14px; cursor: pointer; }
        button[type=submit]:hover { background: #1d4ed8; }

        table { width: 100%; border-collapse: collapse; font-size: 14px; }
        thead tr { background: #f1f5f9; }
        th, td { padding: 10px 14px; text-align: left; border-bottom: 1px solid #e2e8f0; }
        th { font-weight: 600; color: #475569; }
        .badge { display: inline-block; padding: 2px 8px; border-radius: 12px; font-size: 12px; }
        .badge-ok { background: #dcfce7; color: #166534; }
        .badge-expired { background: #fee2e2; color: #991b1b; }
    </style>
</head>
<body>
<div th:fragment="sidebar(activePage)" class="sidebar">
    <div class="sidebar-title">Sentinel</div>
    <nav>
        <a th:href="@{/dashboard/register}" th:classappend="${activePage == 'register'} ? ' active'">사용자 등록 / 매니저 등록</a>
        <a th:href="@{/dashboard/users}"    th:classappend="${activePage == 'users'}    ? ' active'">사용자 관리</a>
        <a th:href="@{/dashboard/apps}"     th:classappend="${activePage == 'apps'}     ? ' active'">애플리케이션 관리</a>
        <a th:href="@{/dashboard/history}"  th:classappend="${activePage == 'history'}  ? ' active'">사용자 히스토리</a>
    </nav>
    <div class="sidebar-footer">
        <a th:href="@{/logout}">로그아웃</a>
    </div>
</div>
</body>
</html>
