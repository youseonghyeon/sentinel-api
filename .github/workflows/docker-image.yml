name: CI/CD

on:
  push:
    branches: [ "main" ]

permissions:
  contents: write

jobs:
  test-build-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      - name: Test
        run: ./gradlew test --no-daemon

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/sentinel-api:${{ github.sha }}
            ${{ secrets.DOCKERHUB_USERNAME }}/sentinel-api:latest

      - name: Update image tag in Helm values
        run: |
          sed -i 's|repository: .*|repository: "${{ secrets.DOCKERHUB_USERNAME }}/sentinel-api"|' deploy/values.yaml
          sed -i 's|tag: .*|tag: "${{ github.sha }}"|' deploy/values.yaml

      - name: Commit and push Helm values
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add deploy/values.yaml
          git diff --cached --quiet || git commit -m "ci: update image tag to ${{ github.sha }}"
          git push
